name = "blueport"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "blueport"
database_id = "698e6b1b-2ef0-4b29-b52b-2e8f2d897149"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "blueport-docs"

# Vectorize index "blueport-pages" — dimensions=768, metric=cosine.
[[vectorize]]
binding = "VECTORS"
index_name = "blueport-pages"

[ai]
binding = "AI"
