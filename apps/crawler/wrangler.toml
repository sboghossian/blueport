name = "blueport-crawler"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[triggers]
crons = ["0 */6 * * *"] # every 6 hours

[[d1_databases]]
binding = "DB"
database_name = "blueport"
database_id = "698e6b1b-2ef0-4b29-b52b-2e8f2d897149"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "blueport-docs"

# Vectorize index "blueport-pages" — provisioned via scripts/setup.sh with
# dimensions=768, metric=cosine (Voyage-3 embedding family).
[[vectorize]]
binding = "VECTORS"
index_name = "blueport-pages"

[ai]
binding = "AI"

# Headless Chrome for browser-kind connectors (SIAN, Corbell).
# Requires the Workers Paid plan.
[browser]
binding = "BROWSER"

[vars]
USER_AGENT = "BlueportBot/0.2 (+https://github.com/sboghossian/blueport)"
# Sources are defined in packages/db/src/connectors.ts (the connector registry),
# not here — adding a government release = adding one entry there.
# CRAWL_ADMIN_TOKEN is set via `wrangler secret put CRAWL_ADMIN_TOKEN`
